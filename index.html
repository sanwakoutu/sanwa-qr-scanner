<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanwa QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  :root {
    --brand-green: #06C755;
    --brand-green-dark: #049945;
    --brand-orange: #ff9800;
    --ink: #1a2b22;
    --paper: #f4f7f5;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #0d1f16 0%, #142a1e 55%, #0d1f16 100%);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Helvetica Neue", Arial, sans-serif;
    color: var(--paper);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 40px;
  }

  .brand {
    text-align: center;
    margin-bottom: 22px;
  }

  .brand .taxi-emoji {
    font-size: 34px;
    display: block;
    margin-bottom: 4px;
  }

  .brand h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
  }

  .brand p {
    margin: 6px 0 0;
    font-size: 13px;
    color: #9fd8b6;
    letter-spacing: 0.03em;
  }

  .scan-stage {
    position: relative;
    width: min(92vw, 420px);
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    overflow: hidden;
    background: #000;
    box-shadow: 0 10px 40px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.06);
  }

  #reader {
    width: 100% !important;
    height: 100% !important;
  }

  #reader video {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
  }

  /* html5-qrcode injects its own UI bits we don't want cluttering the view */
  #reader img, #reader__dashboard_section_csr span { display: none !important; }
  #reader__scan_region { border: none !important; }
  #reader__dashboard { display: none !important; }

  /* Viewfinder frame overlay */
  .viewfinder {
    position: absolute;
    inset: 14%;
    pointer-events: none;
    z-index: 5;
  }

  .corner {
    position: absolute;
    width: 34px;
    height: 34px;
    border-color: var(--brand-green);
    border-style: solid;
    border-width: 0;
    filter: drop-shadow(0 0 6px rgba(6,199,85,0.7));
  }
  .corner.tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 10px; }
  .corner.tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 10px; }
  .corner.bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 10px; }
  .corner.br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 10px; }

  .scan-line {
    position: absolute;
    left: 14%;
    right: 14%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--brand-green) 20%, #b6ffd4 50%, var(--brand-green) 80%, transparent);
    box-shadow: 0 0 12px 2px rgba(6,199,85,0.8);
    z-index: 6;
    animation: sweep 2.6s ease-in-out infinite;
  }

  @keyframes sweep {
    0%   { top: 14%; opacity: 0; }
    8%   { opacity: 1; }
    50%  { top: 86%; opacity: 1; }
    92%  { opacity: 1; }
    100% { top: 14%; opacity: 0; }
  }

  .status {
    margin-top: 22px;
    font-size: 14px;
    color: #cdeedc;
    text-align: center;
    min-height: 20px;
  }

  .status.err {
    color: #ffb4a8;
    font-weight: bold;
  }

  .hint {
    margin-top: 6px;
    font-size: 12px;
    color: #6f9d84;
  }

  @media (prefers-reduced-motion: reduce) {
    .scan-line { animation: none; top: 50%; }
  }
</style>
</head>
<body>

<div class="brand">
  <span class="taxi-emoji">🚕</span>
  <h1>三和交通グループ</h1>
  <p>QRコードをカメラにかざしてください</p>
</div>

<div class="scan-stage">
  <div id="reader"></div>
  <div class="viewfinder">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
  </div>
  <div class="scan-line"></div>
</div>

<div class="status" id="statusText">カメラを起動しています...</div>
<div class="hint">枠内にQRコードが収まるように近づけてください</div>

<script>
let opened = false;
const statusEl = document.getElementById('statusText');

function setStatus(text, isErr) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (isErr ? ' err' : '');
}

function openUrl(url){
  if(opened) return;
  opened = true;
  setStatus('読み取りました。移動しています...');
  html5QrCode.stop().catch(()=>{});
  // 💡 location.replace() を使うことで、このスキャナー画面を履歴に残さず置き換える。
  //    これにより、クーポン画面で「LINEに戻る」をタップした際に
  //    このスキャナー画面が裏に残って再表示されることがなくなる。
  window.top.location.replace(url);
}

const html5QrCode = new Html5Qrcode("reader");
Html5Qrcode.getCameras().then(cameras => {
  if (!cameras.length) {
    setStatus('カメラが見つかりません', true);
    return;
  }
  const cameraId = cameras[cameras.length - 1].id;
  html5QrCode.start(
    cameraId,
    {
      fps: 10,
      qrbox: { width: 250, height: 250 }
    },
    (decodedText) => {
      let url = decodedText.trim();
      if (url.startsWith("http://") || url.startsWith("https://")) {
        openUrl(url);
      } else {
        setStatus('このコードは読み取れません', true);
      }
    },
    () => {}
  ).then(() => {
    setStatus('QRコードにカメラを向けてください');
  }).catch((err) => {
    setStatus('カメラを起動できませんでした', true);
    console.error(err);
  });
}).catch((err) => {
  setStatus('カメラへのアクセスが許可されていません', true);
  console.error(err);
});
</script>
</body>
</html>
