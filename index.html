<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanwa QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family: Arial, sans-serif;
  text-align:center;
  padding:20px;
}

#reader{
  width:100%;
  max-width:400px;
  margin:auto;
}

h2{
  color:#333;
}
</style>
</head>

<body>

<h2>🚖 QRコードをスキャンしてください</h2>

<div id="reader"></div>

<script>

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices => {

  if (!devices.length) {
    document.body.innerHTML = "<h3>カメラが見つかりません。</h3>";
    return;
  }

  const backCamera = devices[devices.length - 1];

  html5QrCode.start(
    backCamera.id,
    {
      fps: 10,
      qrbox: 250
    },
    (decodedText) => {

      html5QrCode.stop();

      let url = decodedText.trim();

      if (!url.startsWith("http://") &&
          !url.startsWith("https://")) {
        url = "https://" + url;
      }

      location.replace(url);

    },
    (errorMessage) => {}
  );

}).catch(err => {

  document.body.innerHTML =
    "<h3>カメラへのアクセスに失敗しました。</h3>";

});

</script>

</body>
</html>
