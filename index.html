<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanwa QR Scanner</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body{
  font-family: Arial,sans-serif;
  text-align:center;
  padding:20px;
}
#reader{
  width:100%;
  max-width:400px;
  margin:auto;
}
</style>
</head>

<body>

<h2>🚖 QRコードをスキャンしてください</h2>
<div id="reader"></div>

<script>

let opened = false;

function openUrl(url){
  if(opened) return;
  opened = true;

  html5QrCode.stop().catch(()=>{});

  // Google Form directly open
  window.top.location = url;
}

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(cameras => {

  if (!cameras.length) {
    alert("カメラが見つかりません");
    return;
  }

  const cameraId = cameras[cameras.length - 1].id;

  html5QrCode.start(
    cameraId,
    {
      fps: 10,
      qrbox: { width: 250, height: 250 }
    },
    (decodedText) => {

      let url = decodedText.trim();

      if (
        url.startsWith("http://") ||
        url.startsWith("https://")
      ) {
        openUrl(url);
      } else {
        alert(url);
      }

    },
    () => {}
  );

});

</script>

</body>
</html>
